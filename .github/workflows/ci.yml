name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm run install:ui

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Rebuild the UI
        run: npm run build:ui

      - name: Fail if the committed ui/ build is stale
        run: |
          if ! git diff --quiet -- ui; then
            echo "::error::ui/ is out of date — run 'npm run build:ui' and commit the result."
            git --no-pager diff --stat -- ui
            exit 1
          fi

      - name: Run tests
        run: npm test
